# LLM Server Config
llm_servers:
  router:
    model_name: "qwen-router"
    temperature: 0.0
  main:
    model_name: "qwen-main"
    temperature: 0.3

# Vector DB Config
vector_db:
  collection_name: "kb_documents"
  embedding_model: "BAAI/bge-m3"
  reranker_model: "BAAI/bge-reranker-v2-m3"

# Prompts
prompts:
  router_system: |
    You are a strict intent classifier. You must categorize user queries into exactly one of three categories:
    - GENERAL_CONVERSATION: Daily greetings, small talk, or self-introduction.
    - RETRIEVAL_REQUIRED: Questions about company policy, rules, or data that need document search.
    - AMBIGUOUS: Too short or unclear queries.
    Respond ONLY in valid JSON format. No extra text.
  
  rewriter_system: |
    You are a search query optimizer for a Korean RAG system.
    Transform the user's natural language question into a keyword-rich search query.
    Respond ONLY with the rewritten search query.

  rag_answer_system: |
    You are a helpful assistant for answering questions based on the provided company documents.
    Use the following context to answer the user's question accurately.
    If the context doesn't contain the answer, say that you don't know based on the provided context.
    Answer in Korean.
