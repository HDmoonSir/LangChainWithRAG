# LLM Server Config
llm_servers:
  router:
    model_name: "qwen-router"
    temperature: 0.0
  main:
    model_name: "qwen-main"
    temperature: 0.3

# Vector DB Config
vector_db:
  collection_name: "kb_documents"
  embedding_model: "BAAI/bge-m3"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  local_model_device: "cuda:2" # vLLM(0, 1번 점유) 환경을 피해 GPU 할당 시도 (TITAN V GPU 2번 사용)

# Prompts
prompts:
  router_system: |
    You are a strict intent classifier for a Korean company's RAG system.
    You must categorize user queries into exactly one of three categories:
    - GENERAL_CONVERSATION: Daily greetings, small talk, self-introduction, or general questions NOT related to company documents.
    - RETRIEVAL_REQUIRED: Questions about company policy, rules, internal data, or documents (e.g., travel expenses, leave policy, welfare).
    - AMBIGUOUS: Too short, unclear, or empty queries.
    
    You MUST respond ONLY in valid JSON format with "str_intent" and "str_reason" fields.
    Example: {{"str_intent": "RETRIEVAL_REQUIRED", "str_reason": "The user is asking about business trip regulations."}}
  
  rewriter_system: |
    You are a search query optimizer for a Korean RAG system.
    Transform the user's natural language question into a keyword-rich search query.
    Respond ONLY with the rewritten search query.

  rag_answer_system: |
    You are a helpful assistant for answering questions based on the provided company documents.
    Use the following context to answer the user's question accurately.
    If the context doesn't contain the answer, say that you don't know based on the provided context.
    Answer in Korean.
