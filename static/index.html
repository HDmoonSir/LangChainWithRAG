<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production RAG Engine - Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Markdown & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <header>
        <h1>RAG Engine Chat</h1>
        <div id="status-indicator">Ready</div>
    </header>

    <main id="chat-history"></main>

    <footer>
        <div class="input-container">
            <textarea id="query-input" placeholder="무엇이든 물어보세요..." rows="1"></textarea>
            <button id="send-btn">전송</button>
        </div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
